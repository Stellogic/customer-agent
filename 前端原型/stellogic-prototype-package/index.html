<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0c3b2e" />
  <title>Stellogic Customer Support Agent · HTML 高保真交互原型</title>
  <style>
    :root {
      --forest-1000:#06251d;
      --forest-950:#082d23;
      --forest-900:#0b382b;
      --forest-850:#104433;
      --forest-800:#14523e;
      --forest-700:#1b654b;
      --forest-600:#24775a;
      --forest-500:#328b69;
      --forest-300:#8bb9a3;
      --forest-200:#bed8ca;
      --forest-100:#e4efe9;
      --forest-50:#f2f8f4;
      --ivory:#f7f4ec;
      --ivory-2:#fbfaf6;
      --surface:#fffefa;
      --surface-strong:#ffffff;
      --canvas:#f2f4f2;
      --ink:#14231e;
      --ink-2:#26352f;
      --muted:#68746f;
      --muted-2:#909b96;
      --line:#dde3df;
      --line-strong:#cfd8d3;
      --blue:#3977c6;
      --blue-soft:#eaf2fd;
      --orange:#d87920;
      --orange-soft:#fff2e3;
      --red:#d34f4b;
      --red-soft:#fdeceb;
      --green:#2a8a5b;
      --green-soft:#eaf6ef;
      --yellow:#b88618;
      --yellow-soft:#fff8dd;
      --shadow-xs:0 1px 2px rgba(9, 42, 31, .04);
      --shadow-sm:0 8px 24px rgba(9, 42, 31, .06);
      --shadow-md:0 18px 42px rgba(9, 42, 31, .09);
      --shadow-lg:0 28px 80px rgba(9, 42, 31, .14);
      --radius-sm:10px;
      --radius:16px;
      --radius-lg:22px;
      --sidebar-w:224px;
      --topbar-h:66px;
      --font-sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      --font-display:"Iowan Old Style","Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    svg{display:block}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .hidden{display:none!important}

    /* Shared primitives */
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{width:32px;height:32px;flex:0 0 auto}
    .brand-copy{display:flex;flex-direction:column;line-height:1.1;min-width:0}
    .brand-name{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}
    .brand-on-dark .brand-name{color:white}
    .brand-on-dark .brand-sub{color:rgba(255,255,255,.62)}

    .icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .icon-sm{width:15px;height:15px}
    .icon-lg{width:24px;height:24px}
    .icon-xl{width:34px;height:34px}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;min-height:40px;font-weight:650;color:var(--ink);background:white;transition:.18s ease;white-space:nowrap;box-shadow:var(--shadow-xs)}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .btn:active{transform:translateY(0)}
    .btn-primary{background:var(--forest-900);border-color:var(--forest-900);color:white}
    .btn-primary:hover{background:var(--forest-800);border-color:var(--forest-800)}
    .btn-outline{border-color:var(--forest-300);color:var(--forest-800);background:rgba(255,255,255,.72)}
    .btn-ghost{border-color:var(--line);background:white;color:var(--ink-2)}
    .btn-danger{background:var(--red);border-color:var(--red);color:white}
    .btn-warning{background:var(--orange);border-color:var(--orange);color:white}
    .btn-sm{min-height:34px;padding:7px 11px;border-radius:9px;font-size:13px}
    .btn-lg{min-height:48px;padding:12px 20px;border-radius:12px;font-size:15px}
    .btn-block{width:100%}
    .btn-icon{width:40px;padding:0}
    .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

    .chip,.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);padding:6px 10px;font-size:12px;font-weight:650;background:white;color:var(--ink-2);white-space:nowrap}
    .chip-soft{background:var(--forest-50);border-color:var(--forest-100);color:var(--forest-800)}
    .badge{padding:4px 8px;border-radius:7px;font-weight:700}
    .badge-green{background:var(--green-soft);border-color:#c7e7d3;color:#21754d}
    .badge-blue{background:var(--blue-soft);border-color:#cfe0f7;color:#2f67ab}
    .badge-orange{background:var(--orange-soft);border-color:#f3d8b8;color:#b56519}
    .badge-red{background:var(--red-soft);border-color:#f2c9c7;color:#bd403c}
    .badge-yellow{background:var(--yellow-soft);border-color:#f1df9d;color:#946c11}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(42,138,91,.11)}
    .status-dot.orange{background:var(--orange);box-shadow:0 0 0 4px rgba(216,121,32,.12)}
    .status-dot.red{background:var(--red);box-shadow:0 0 0 4px rgba(211,79,75,.12)}
    .status-dot.blue{background:var(--blue);box-shadow:0 0 0 4px rgba(57,119,198,.12)}

    .card{background:rgba(255,254,250,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
    .card-plain{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-xs)}
    .card-pad{padding:20px}
    .card-pad-lg{padding:26px}
    .section-title{font-size:16px;font-weight:750;color:var(--ink);margin:0 0 12px}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--forest-700);font-weight:800}
    .display-title{font-family:var(--font-display);font-size:54px;line-height:1.05;letter-spacing:-1.9px;font-weight:600;margin:8px 0 12px;color:#10241d}
    .page-title{font-family:var(--font-display);font-size:44px;line-height:1.1;letter-spacing:-1.2px;font-weight:600;margin:0;color:#10241d}
    .subtle{color:var(--muted)}
    .muted{color:var(--muted-2)}
    .divider{height:1px;background:var(--line);margin:18px 0}
    .stack{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;align-items:center;gap:10px}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .wrap{flex-wrap:wrap}
    .grow{flex:1;min-width:0}
    .text-right{text-align:right}
    .link{color:var(--forest-700);font-weight:650}
    .link:hover{text-decoration:underline}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .small{font-size:12px}
    .tiny{font-size:11px}
    .danger{color:var(--red)}
    .warning{color:var(--orange)}
    .success{color:var(--green)}

    .input,.textarea,.select-control{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:10px;min-height:44px;padding:10px 13px;color:var(--ink);outline:none;transition:.16s ease}
    .input:focus,.textarea:focus,.select-control:focus{border-color:var(--forest-500);box-shadow:0 0 0 3px rgba(50,139,105,.12)}
    .textarea{min-height:130px;resize:vertical}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-weight:700;color:var(--ink-2)}
    .input-wrap{position:relative}
    .input-wrap .input{padding-left:41px}
    .input-prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2)}

    .notice{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--ivory-2)}
    .notice-success{background:var(--green-soft);border-color:#c9e4d3}
    .notice-warning{background:var(--orange-soft);border-color:#f0d2ad}
    .notice-danger{background:var(--red-soft);border-color:#efc8c6}
    .notice-blue{background:var(--blue-soft);border-color:#ccdef6}

    /* Customer shell */
    .customer-page{min-height:100vh;background:
      radial-gradient(circle at 90% 12%, rgba(174,211,190,.30), transparent 26%),
      radial-gradient(circle at 12% 88%, rgba(235,226,198,.27), transparent 27%),
      linear-gradient(180deg,#fffefb 0%,#faf8f1 100%)}
    .customer-header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid rgba(210,218,213,.72);background:rgba(255,255,255,.78);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
    .customer-header-left,.customer-nav,.customer-header-right{display:flex;align-items:center;gap:26px}
    .customer-nav a{font-weight:700;color:var(--ink-2);padding:23px 2px 21px;position:relative}
    .customer-nav a.active:after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:3px;border-radius:3px;background:var(--forest-800)}
    .avatar{width:38px;height:38px;border-radius:50%;background:var(--forest-900);color:white;display:grid;place-items:center;font-weight:800;box-shadow:0 0 0 4px var(--forest-50)}
    .customer-main{max-width:1480px;margin:0 auto;padding:48px 56px 34px}
    .customer-auth .customer-main{max-width:1500px;padding-top:58px}

    .auth-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(460px,.8fr);gap:72px;align-items:center;min-height:calc(100vh - 160px)}
    .auth-story{padding-left:12px}
    .auth-story h1{font-family:var(--font-display);font-size:58px;line-height:1.2;letter-spacing:-2px;font-weight:600;margin:28px 0 20px;color:#142822;max-width:820px}
    .feature-list{display:flex;flex-direction:column;gap:22px;margin-top:34px;max-width:670px}
    .feature-row{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:center}
    .feature-icon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#edf5ef,#f9f6e9);color:var(--forest-700);border:1px solid var(--forest-100)}
    .feature-row strong{display:block;font-size:17px;margin-bottom:3px}
    .auth-card{padding:36px 40px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);border:1px solid rgba(207,216,211,.92);border-radius:22px;box-shadow:var(--shadow-lg)}
    .auth-card h2{font-family:var(--font-display);font-size:38px;margin:0 0 4px;font-weight:600}
    .auth-fields{display:flex;flex-direction:column;gap:17px;margin-top:28px}
    .demo-zone{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
    .security-ribbon{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:34px;padding:15px 18px;border:1px solid #e4e0d4;background:rgba(255,252,244,.78);border-radius:12px;max-width:670px}

    .help-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(500px,.8fr);gap:70px;align-items:start;padding:18px 0 32px}
    .help-copy{padding-top:26px}
    .help-copy .display-title{font-size:60px;max-width:760px;line-height:1.16}
    .hero-lead{font-size:17px;line-height:1.9;color:var(--ink-2);max-width:700px;margin-top:26px}
    .trust-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #e6e2d7;border-radius:14px;background:rgba(255,252,244,.76);margin-top:36px;max-width:760px;overflow:hidden}
    .trust-item{padding:16px 18px;display:flex;gap:12px;align-items:center;min-width:0}
    .trust-item+.trust-item{border-left:1px solid #e7e3d8}
    .trust-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--forest-100);color:var(--forest-700);flex:0 0 auto}
    .help-form-card{padding:30px 32px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-md)}
    .help-form-card h2{font-family:var(--font-display);font-size:30px;margin:0 0 18px;font-weight:600}
    .or-divider{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;color:var(--muted);margin:17px 0}
    .or-divider:before,.or-divider:after{content:"";height:1px;background:var(--line)}
    .feature-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
    .feature-card{padding:24px;border:1px solid #e6e1d5;background:rgba(255,252,244,.72);border-radius:16px;display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center}
    .feature-card .feature-icon{width:76px;height:76px}
    .feature-card h3{margin:0 0 5px;font-size:18px}
    .tip-bar{margin-top:18px;padding:14px 18px;display:flex;gap:13px;align-items:center;border:1px solid #e7e2d5;border-radius:12px;background:rgba(255,252,244,.76)}

    .breadcrumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:20px}
    .ticket-page-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
    .ticket-hero-card{padding:24px 26px}
    .ticket-id-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .ticket-id{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.3px}
    .timeline-steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin:24px 0 18px}
    .timeline-steps:before{content:"";position:absolute;top:19px;left:10%;right:10%;height:2px;background:var(--line)}
    .step{text-align:center;position:relative;z-index:1}
    .step-node{width:40px;height:40px;border-radius:50%;background:white;border:2px solid var(--line-strong);display:grid;place-items:center;margin:0 auto 8px;color:var(--muted)}
    .step.done .step-node{border-color:var(--green);color:var(--green);background:var(--green-soft)}
    .step.active .step-node{border-color:var(--forest-700);background:var(--forest-700);color:white;box-shadow:0 0 0 7px rgba(36,119,90,.10)}
    .step.warning-step .step-node{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
    .step strong{display:block;font-size:13px}
    .step span{font-size:12px;color:var(--muted)}
    .issue-card,.order-card,.activity-card,.conversation-card,.composer-card{padding:20px 22px}
    .order-summary{display:grid;grid-template-columns:72px 1fr auto;gap:18px;align-items:center}
    .product-thumb{width:68px;height:68px;border-radius:14px;background:linear-gradient(145deg,#eef0ed,#dbe1de);border:1px solid #d9e0dc;display:grid;place-items:center;color:var(--forest-800)}
    .activity-list{display:flex;flex-direction:column;gap:0}
    .activity-item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;position:relative;padding:10px 0}
    .activity-item:not(:last-child):before{content:"";position:absolute;left:16px;top:42px;bottom:-2px;width:1px;background:#cfe2d6}
    .activity-icon{width:34px;height:34px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;border:1px solid #c8e2d2}
    .activity-item.pending .activity-icon{background:#f6f7f6;color:var(--muted-2);border-color:var(--line)}
    .activity-item.warning-item .activity-icon{background:var(--orange-soft);color:var(--orange);border-color:#efd0a8}
    .ticket-side{display:flex;flex-direction:column;gap:18px}
    .progress-card{text-align:center;padding:26px 24px}
    .ai-orb{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:radial-gradient(circle,#fff 2%,#e5f3e9 55%,#f7fbf8 70%);color:var(--forest-700);position:relative}
    .ai-orb:after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px dashed rgba(36,119,90,.28)}
    .ai-orb .icon{width:42px;height:42px;z-index:1}
    .banner-large{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 26px;border-radius:16px;border:1px solid #efd2ad;background:linear-gradient(90deg,#fff7ec,#fffaf2)}
    .conversation-tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);padding:0 20px}
    .conversation-tab{padding:16px 0 13px;font-weight:700;color:var(--muted);position:relative}
    .conversation-tab.active{color:var(--ink)}
    .conversation-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--forest-800);border-radius:3px}
    .message{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:17px 18px;border:1px solid var(--line);border-radius:13px;background:#fff}
    .message-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--forest-50);color:var(--forest-700)}
    .message.human{background:linear-gradient(135deg,#eef7f1,#f8fbf8)}
    .message.customer{background:#fffdfa}
    .composer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
    .ticket-summary-list{display:flex;flex-direction:column;gap:14px}
    .summary-kv{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:13px}
    .mini-timeline{display:flex;flex-direction:column;gap:15px}
    .mini-step{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;position:relative}
    .mini-step:not(:last-child):after{content:"";position:absolute;left:8px;top:20px;bottom:-12px;width:1px;background:var(--line)}
    .mini-dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);background:white;margin-top:2px;z-index:1}
    .mini-step.done .mini-dot{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 4px white}
    .mini-step.active .mini-dot{border-color:var(--orange);background:var(--orange-soft);box-shadow:inset 0 0 0 4px white}

    /* Internal shell */
    .internal-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);background:var(--canvas)}
    .sidebar{background:linear-gradient(180deg,#082f25 0%,#0b3d2f 58%,#092d24 100%);color:white;height:100vh;position:sticky;top:0;padding:20px 12px 14px;display:flex;flex-direction:column;z-index:30;box-shadow:4px 0 20px rgba(5,30,23,.08)}
    .sidebar .brand{padding:2px 8px 22px}
    .sidebar-nav{display:flex;flex-direction:column;gap:6px}
    .side-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:rgba(255,255,255,.76);font-weight:650;transition:.16s ease}
    .side-item:hover{background:rgba(255,255,255,.07);color:white}
    .side-item.active{background:linear-gradient(90deg,rgba(66,152,111,.28),rgba(53,132,98,.18));color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
    .side-label{padding:20px 12px 8px;color:rgba(255,255,255,.42);font-size:12px;letter-spacing:.06em}
    .side-divider{height:1px;background:rgba(255,255,255,.12);margin:14px 8px 3px}
    .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
    .internal-main{min-width:0}
    .internal-topbar{height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.90);backdrop-filter:blur(14px);position:sticky;top:0;z-index:25}
    .topbar-left,.topbar-right{display:flex;align-items:center;gap:12px;min-width:0}
    .workspace-select{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;font-weight:700;box-shadow:var(--shadow-xs)}
    .topbar-avatar{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--line)}
    .topbar-avatar .avatar{width:34px;height:34px}
    .internal-content{padding:28px 34px 44px;max-width:1760px;margin:0 auto}
    .internal-page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
    .internal-page-header p{margin:8px 0 0;color:var(--muted)}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .metrics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
    .metric-card{padding:20px 22px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
    .metric-card.compact{min-height:132px}
    .metric-top{display:flex;align-items:start;justify-content:space-between;gap:12px}
    .metric-label{font-weight:700;color:var(--ink-2)}
    .metric-number{font-family:var(--font-display);font-size:42px;line-height:1;margin-top:8px}
    .spark{height:44px;width:132px}
    .support-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
    .queue-panel{overflow:hidden}
    .filter-bar{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fff}
    .filter-control{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;min-height:38px;color:var(--ink-2);white-space:nowrap}
    .filter-search{position:relative;flex:1;min-width:180px}
    .filter-search input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 38px;outline:none}
    .filter-search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
    .table-scroll{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:880px}
    th{text-align:left;color:var(--muted);font-size:12px;font-weight:750;padding:12px 14px;background:#fafbf9;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr{background:white;transition:.14s ease}
    tbody tr:hover{background:#f7faf8}
    tbody tr.selected{background:#eef6f1}
    tbody tr[data-action]{cursor:pointer}
    .ticket-cell{display:flex;align-items:flex-start;gap:10px}
    .ticket-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:7px;flex:0 0 auto}
    .ticket-dot.orange{background:#eea23f}
    .ticket-dot.blue{background:#4c8de0}
    .table-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:white}
    .pagination{display:flex;align-items:center;gap:5px}
    .page-btn{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink)}
    .page-btn.active{background:var(--forest-900);color:white}
    .detail-drawer{position:sticky;top:calc(var(--topbar-h) + 18px);max-height:calc(100vh - var(--topbar-h) - 44px);overflow:auto}
    .drawer-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .drawer-section{padding:17px 0;border-bottom:1px solid var(--line)}
    .drawer-section:last-child{border-bottom:0}
    .drawer-actions{position:sticky;bottom:-20px;background:linear-gradient(180deg,rgba(255,254,250,.2),#fffefa 30%);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .recommend-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .recommend-item{padding:12px 13px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;background:white}
    .recommend-item+.recommend-item{border-top:1px solid var(--line)}
    .recommend-index{width:22px;height:22px;border-radius:50%;background:var(--forest-100);color:var(--forest-800);display:grid;place-items:center;font-size:11px;font-weight:800}

    .ticket-header-internal{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
    .ticket-header-meta{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);margin-top:6px}
    .owner-blocks{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
    .owner-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border-left:1px solid var(--line)}
    .tabs{display:flex;align-items:center;gap:28px;padding:0 16px;border-bottom:1px solid var(--line);background:white;border-radius:12px 12px 0 0}
    .tab{padding:14px 0 12px;color:var(--muted);font-weight:700;position:relative}
    .tab.active{color:var(--ink)}
    .tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--forest-900);border-radius:3px}
    .ticket-workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr) minmax(290px,.72fr);gap:16px;align-items:start}
    .workspace-col{display:flex;flex-direction:column;gap:16px;min-width:0}
    .reply-box{padding:16px 18px}
    .reply-editor{min-height:110px;border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--muted-2);background:white}
    .editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
    .toolbar-icons{display:flex;align-items:center;gap:6px;color:var(--muted)}
    .tool-btn{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:inherit;display:grid;place-items:center}
    .tool-btn:hover{background:var(--forest-50);color:var(--forest-700)}
    .ai-summary .summary-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .bullet-row{display:grid;grid-template-columns:9px 1fr;gap:9px;align-items:start}
    .bullet-row:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:7px}
    .action-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
    .action-row{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;padding:10px 11px;background:white}
    .action-row+.action-row{border-top:1px solid var(--line)}
    .detail-list{display:flex;flex-direction:column;gap:10px}
    .kv{display:grid;grid-template-columns:94px 1fr;gap:10px;color:var(--ink-2)}
    .kv>span:first-child{color:var(--muted)}
    .logistics-track{display:flex;flex-direction:column;gap:11px;margin-top:10px}
    .logistics-row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center}
    .check-dot{width:17px;height:17px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center}

    .approval-table table{min-width:1210px}
    .amount{font-size:16px;font-weight:800;color:var(--ink)}
    .lease-time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--orange)}
    .lease-time.danger{color:var(--red)}
    .approval-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
    .approval-summary{padding:20px 22px;margin-bottom:14px}
    .summary-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:16px}
    .summary-metric{padding:0 18px;border-left:1px solid var(--line)}
    .summary-metric:first-child{border-left:0;padding-left:0}
    .summary-metric:last-child{padding-right:0}
    .summary-metric .value{font-size:17px;font-weight:800;margin-top:5px}
    .summary-metric .value.amount-big{font-family:var(--font-display);font-size:32px;color:var(--green)}
    .evidence-stack{display:flex;flex-direction:column;gap:12px}
    .evidence-card{padding:18px 20px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:start}
    .evidence-icon{width:40px;height:40px;border-radius:12px;background:var(--forest-50);color:var(--forest-700);display:grid;place-items:center}
    .evidence-content h3{margin:0 0 5px;font-size:17px}
    .evidence-side{min-width:180px;padding-left:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
    .decision-panel{position:sticky;top:calc(var(--topbar-h) + 18px);display:flex;flex-direction:column;gap:12px}
    .ai-recommend{padding:20px}
    .recommend-highlight{padding:18px;border-radius:14px;border:1px solid #cce6d5;background:linear-gradient(135deg,#eff8f2,#fbfdfb)}
    .decision-actions{padding:16px}
    .decision-actions .btn{width:100%;margin-bottom:9px;min-height:48px}
    .decision-actions .btn:last-child{margin-bottom:0}

    .role-select-page{min-height:100vh;background:linear-gradient(180deg,#f5f7f5,#eef3ef);display:flex;flex-direction:column}
    .role-select-body{flex:1;display:grid;place-items:center;padding:60px 24px}
    .role-select-wrap{width:min(980px,100%);text-align:center}
    .role-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:34px;text-align:left}
    .role-card{padding:28px;position:relative;overflow:hidden;transition:.18s ease}
    .role-card:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-40px;top:-50px;background:rgba(65,145,105,.09)}
    .role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .role-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:var(--forest-100);color:var(--forest-800)}
    .role-card h2{font-family:var(--font-display);font-size:30px;margin:18px 0 4px;font-weight:600}
    .capability-list{display:flex;flex-direction:column;gap:9px;margin:20px 0}
    .capability{display:flex;align-items:center;gap:9px;color:var(--ink-2)}

    .internal-login{min-height:100vh;display:grid;grid-template-columns:minmax(440px,.85fr) minmax(520px,1.15fr);background:#f3f5f3}
    .internal-login-story{background:linear-gradient(160deg,#062a21,#0d4937);color:white;padding:52px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .internal-login-story:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-210px;bottom:-170px;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 70px rgba(255,255,255,.025),0 0 0 150px rgba(255,255,255,.018)}
    .internal-login-story h1{font-family:var(--font-display);font-size:54px;line-height:1.14;font-weight:600;letter-spacing:-1.5px;margin:auto 0 20px;max-width:560px}
    .internal-login-story p{max-width:520px;color:rgba(255,255,255,.72);font-size:16px}
    .internal-login-story .security-points{margin-top:38px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;z-index:1}
    .security-point{padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.045)}
    .internal-login-form-area{display:grid;place-items:center;padding:48px}
    .internal-login-card{width:min(520px,100%);padding:34px 38px}
    .demo-role-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
    .demo-role-buttons .wide{grid-column:1/-1}

    /* State gallery & errors */
    .state-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .state-card{padding:20px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}
    .state-visual{min-height:104px;display:grid;place-items:center;padding:12px;border-radius:12px;background:#fafbf9;border:1px dashed var(--line-strong)}
    .skeleton{width:100%;display:flex;flex-direction:column;gap:10px}
    .skeleton-line{height:12px;border-radius:6px;background:linear-gradient(90deg,#e7ebe8 20%,#f5f7f5 45%,#e7ebe8 70%);background-size:200% 100%;animation:shimmer 1.35s infinite}
    @keyframes shimmer{to{background-position:-200% 0}}
    .error-page{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8faf8,#eef2ef);padding:30px}
    .error-wrap{text-align:center;max-width:700px}
    .error-code{font-family:var(--font-display);font-size:128px;line-height:.9;color:var(--forest-900);margin:0}
    .error-wrap h1{font-family:var(--font-display);font-size:42px;font-weight:600;margin:14px 0 8px}
    .error-wrap p{color:var(--muted);font-size:16px}

    /* Prototype chrome */
    #prototype-toggle{position:fixed;right:22px;bottom:22px;z-index:1000;border:0;border-radius:999px;background:#102d24;color:white;padding:12px 17px;display:flex;align-items:center;gap:8px;box-shadow:0 16px 36px rgba(8,45,35,.28);font-weight:750}
    #prototype-panel{position:fixed;right:22px;bottom:78px;width:min(390px,calc(100vw - 32px));max-height:min(720px,calc(100vh - 100px));overflow:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);z-index:999;padding:16px;display:none}
    #prototype-panel.open{display:block;animation:panelIn .18s ease}
    @keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    .prototype-section{margin-top:14px}
    .prototype-section-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px 5px}
    .prototype-routes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .route-btn{border:1px solid var(--line);background:white;border-radius:10px;text-align:left;padding:9px 10px;font-size:12px;color:var(--ink-2);transition:.14s ease}
    .route-btn:hover,.route-btn.active{border-color:var(--forest-300);background:var(--forest-50);color:var(--forest-800)}
    #toast-root{position:fixed;right:24px;top:82px;z-index:1200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
    .toast{min-width:300px;max-width:420px;padding:13px 15px;border-radius:12px;color:var(--ink);background:white;border:1px solid var(--line);box-shadow:var(--shadow-md);display:flex;gap:11px;align-items:flex-start;animation:toastIn .2s ease}
    .toast.success{border-left:4px solid var(--green)}
    .toast.warning{border-left:4px solid var(--orange)}
    .toast.error{border-left:4px solid var(--red)}
    @keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    #modal-root{position:fixed;inset:0;z-index:1300;display:none;place-items:center;background:rgba(6,35,27,.42);padding:20px;backdrop-filter:blur(3px)}
    #modal-root.open{display:grid}
    .modal{width:min(520px,100%);background:white;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:24px}
    .modal h3{font-family:var(--font-display);font-size:28px;font-weight:600;margin:0 0 7px}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

    /* Responsive */
    @media (max-width:1400px){
      .customer-main{padding-left:38px;padding-right:38px}
      .support-layout{grid-template-columns:minmax(0,1fr) 370px}
      .ticket-workspace{grid-template-columns:minmax(0,1.05fr) minmax(310px,.9fr)}
      .ticket-workspace>.workspace-col:last-child{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}
      .ticket-workspace>.workspace-col:last-child>.card{height:100%}
      .metrics-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:1180px){
      :root{--sidebar-w:80px}
      .sidebar .brand-copy,.side-item span,.side-label,.sidebar-footer span{display:none}
      .sidebar .brand{justify-content:center;padding-left:0;padding-right:0}
      .side-item{justify-content:center;padding:12px}
      .sidebar-footer .side-item{justify-content:center}
      .help-hero,.auth-grid{grid-template-columns:1fr;gap:34px}
      .help-copy .display-title{font-size:50px}
      .feature-cards{grid-template-columns:1fr}
      .feature-card{grid-template-columns:70px 1fr}
      .support-layout{grid-template-columns:1fr}
      .detail-drawer{position:relative;top:0;max-height:none}
      .approval-detail-grid{grid-template-columns:1fr}
      .decision-panel{position:relative;top:0;display:grid;grid-template-columns:1fr 1fr}
      .decision-panel>.card:last-child{grid-column:1/-1}
      .summary-metrics{grid-template-columns:repeat(3,1fr);row-gap:18px}
      .summary-metric:nth-child(4){border-left:0;padding-left:0}
      .state-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:900px){
      .customer-header{padding:0 18px}
      .customer-nav{display:none}
      .customer-main{padding:30px 20px}
      .auth-story h1{font-size:44px}
      .auth-card{padding:28px 24px}
      .help-copy .display-title{font-size:44px}
      .trust-strip{grid-template-columns:1fr}
      .trust-item+.trust-item{border-left:0;border-top:1px solid #e7e3d8}
      .ticket-page-grid{grid-template-columns:1fr}
      .ticket-side{display:grid;grid-template-columns:1fr 1fr}
      .internal-content{padding:22px 20px 36px}
      .internal-topbar{padding:0 16px}
      .topbar-right .chip:nth-child(-n+2){display:none}
      .ticket-workspace{grid-template-columns:1fr}
      .ticket-workspace>.workspace-col:last-child{display:flex;grid-column:auto}
      .role-cards{grid-template-columns:1fr}
      .internal-login{grid-template-columns:1fr}
      .internal-login-story{min-height:460px}
      .internal-login-form-area{padding:30px 20px}
      .evidence-card{grid-template-columns:40px 1fr}
      .evidence-side{grid-column:2;border-left:0;border-top:1px solid var(--line);padding:12px 0 0;min-width:0}
    }
    @media (max-width:720px){
      .metrics-grid[style]{grid-template-columns:1fr!important;max-width:none!important}
      :root{--sidebar-w:0px}
      .sidebar{display:none}
      .internal-shell{grid-template-columns:1fr}
      .internal-page-header,.ticket-header-internal{align-items:flex-start;flex-direction:column}
      .header-actions,.owner-blocks{justify-content:flex-start}
      .metrics-grid{grid-template-columns:1fr}
      .customer-header-right .chip{display:none}
      .customer-header{height:64px}
      .brand-name{font-size:21px}
      .brand-sub{display:none}
      .auth-story{padding-left:0}
      .auth-story h1{font-size:38px}
      .feature-list{gap:16px}
      .feature-row{grid-template-columns:46px 1fr}
      .feature-icon{width:46px;height:46px}
      .security-ribbon{align-items:flex-start;flex-direction:column}
      .help-copy .display-title{font-size:38px}
      .feature-card{grid-template-columns:1fr}
      .feature-card .feature-icon{width:58px;height:58px}
      .ticket-side{grid-template-columns:1fr}
      .timeline-steps{grid-template-columns:repeat(2,1fr);gap:20px}
      .timeline-steps:before{display:none}
      .order-summary{grid-template-columns:60px 1fr}
      .order-summary>.link{grid-column:2}
      .role-select-body{padding:34px 16px}
      .internal-login-story{padding:34px 24px;min-height:400px}
      .internal-login-story h1{font-size:40px}
      .internal-login-story .security-points{grid-template-columns:1fr}
      .internal-login-card{padding:26px 22px}
      .demo-role-buttons{grid-template-columns:1fr}
      .demo-role-buttons .wide{grid-column:auto}
      .summary-metrics{grid-template-columns:1fr 1fr}
      .summary-metric{border-left:0;padding:0;border-top:1px solid var(--line);padding-top:12px}
      .summary-metric:first-child{border-top:0}
      .decision-panel{display:flex}
      .state-grid{grid-template-columns:1fr}
      .filter-bar{flex-wrap:wrap}
      .filter-search{order:-1;flex-basis:100%}
      .display-title,.page-title{font-size:36px}
      #prototype-toggle{right:14px;bottom:14px}
      #prototype-panel{right:14px;bottom:68px}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <button id="prototype-toggle" type="button" aria-expanded="false" aria-controls="prototype-panel">
    <span id="prototype-toggle-icon"></span>
    原型导航
  </button>
  <aside id="prototype-panel" aria-label="原型页面导航">
    <div class="row-between">
      <div>
        <strong>Stellogic 高保真原型</strong>
        <div class="small subtle">点击页面名称快速切换</div>
      </div>
      <button class="btn btn-ghost btn-sm btn-icon" data-action="close-prototype" aria-label="关闭导航"><span data-icon="x"></span></button>
    </div>
    <div class="prototype-section">
      <div class="prototype-section-title">客户侧</div>
      <div class="prototype-routes">
        <button class="route-btn" data-route="/help/login">客户登录</button>
        <button class="route-btn" data-route="/help">帮助中心首页</button>
        <button class="route-btn" data-route="/help/tickets/TKT-250823-0013">AI 调查中</button>
        <button class="route-btn" data-route="/help/tickets/TKT-250823-0013/clarification">等待客户澄清</button>
        <button class="route-btn" data-route="/help/tickets/TKT-250823-0013/human">人工客服处理中</button>
      </div>
    </div>
    <div class="prototype-section">
      <div class="prototype-section-title">内部工作台</div>
      <div class="prototype-routes">
        <button class="route-btn" data-route="/internal/login">内部人员登录</button>
        <button class="route-btn" data-route="/internal">双角色选择</button>
        <button class="route-btn" data-route="/internal/support">客服共享队列</button>
        <button class="route-btn" data-route="/internal/support/tickets/TKT-250823-0013">客服工单详情</button>
        <button class="route-btn" data-route="/internal/approvals">补偿审批队列</button>
        <button class="route-btn" data-route="/internal/approvals/PRP-250823-0042">补偿审批详情</button>
      </div>
    </div>
    <div class="prototype-section">
      <div class="prototype-section-title">关键状态</div>
      <div class="prototype-routes">
        <button class="route-btn" data-route="/states">状态组件画廊</button>
        <button class="route-btn" data-route="/403">403 页面</button>
        <button class="route-btn" data-route="/404">404 页面</button>
      </div>
    </div>
    <div class="notice notice-blue small" style="margin-top:14px">
      <span data-icon="info"></span>

    function hydrateIcons(root=document){

    function toast(message,type='success',detail=''){
      const root=document.getElementById('toast-root');
      const el=document.createElement('div');
      el.className=`toast ${type}`;
      const iconName=type==='error'?'warning':type==='warning'?'info':'check';
      el.innerHTML=`${icon(iconName)}<div><strong>${message}</strong>${detail?`<div class="small subtle">${detail}</div>`:''}</div>`;
      root.appendChild(el);
      setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-6px)';setTimeout(()=>el.remove(),180)},3200);
    }

      }
      if(e.target.id==='approval-search'){
        const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#approval-body tr').forEach(row=>{row.style.display=row.dataset.searchable.toLowerCase().includes(q)?'':'none'});
      }
    });

    document.getElementById('prototype-toggle').addEventListener('click',()=>{
      const panel=document.getElementById('prototype-panel');const open=panel.classList.toggle('open');document.getElementById('prototype-toggle').setAttribute('aria-expanded',String(open));
    });
    document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.id==='modal-root')closeModal()});
    window.addEventListener('hashchange',render);
    hydrateIcons(document);
    render();
  </script>
</body>
</html>
