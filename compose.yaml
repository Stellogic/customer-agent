name: customer-agent-baseline

x-secrets: &local-secrets
  SPRING_TO_AGENT_TOKEN: ${SPRING_TO_AGENT_TOKEN:-local-spring-to-agent}
  AGENT_MACHINE_TOKEN: ${AGENT_MACHINE_TOKEN:-local-agent-machine}
  EXECUTOR_MACHINE_TOKEN: ${EXECUTOR_MACHINE_TOKEN:-local-executor-machine}
  DEMO_FIXED_INSTANT: ${DEMO_FIXED_INSTANT:-2026-08-09T14:00:00Z}

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local-postgres-superuser}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [data]

  spring-migrate:
    image: customer-agent/backend:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    build:
      context: ./backend
      args:
        GRADLE_OPTS: ${CUSTOMER_AGENT_GRADLE_OPTS:-}
    environment:
      SPRING_FLYWAY_ENABLED: "true"
      BASELINE_MIGRATE_ONLY: "true"
      SPRING_DATABASE_URL: jdbc:postgresql://postgres:5432/customer_agent
      SPRING_DATABASE_USER: spring_app
      SPRING_DATABASE_PASSWORD: local-spring-app
      SPRING_MIGRATION_DATABASE_URL: jdbc:postgresql://postgres:5432/customer_agent
      SPRING_MIGRATION_DATABASE_USER: spring_migrator
      SPRING_MIGRATION_DATABASE_PASSWORD: local-spring-migrator
      AGENT_SERVER_URL: http://agent-server:2024
      <<: *local-secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [data, services]

  agent-migrate:
    image: customer-agent/agent:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    build:
      context: ./agent
      target: runtime
    entrypoint: ["python", "-m", "baseline_agent.migrate"]
    environment:
      AGENT_MIGRATION_DATABASE_URI: postgresql://agent_migrator:local-agent-migrator@postgres:5432/agent_checkpoint
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [data]

  agent-server:
    image: customer-agent/agent:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    build:
      context: ./agent
      target: runtime
    environment:
      AGENT_DATABASE_URI: postgresql://agent_runtime:local-agent-runtime@postgres:5432/agent_checkpoint
      SPRING_INTERNAL_URL: http://backend:8080
      SPRING_TO_AGENT_TOKEN: ${SPRING_TO_AGENT_TOKEN:-local-spring-to-agent}
      AGENT_MACHINE_TOKEN: ${AGENT_MACHINE_TOKEN:-local-agent-machine}
      LOG_LEVEL: ERROR
    command: ["--server-log-level", "ERROR"]
    # 私有编排运行时的第三方错误日志会携带 thread/run/checkpoint 标识；产品日志面不采集该流。
    logging:
      driver: "none"
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,os; r=httpx.get('http://localhost:2024/ok',headers={'Authorization':'Bearer '+os.environ['SPRING_TO_AGENT_TOKEN']}); r.raise_for_status()"]
      interval: 3s
      timeout: 4s
      retries: 30
    networks: [data, services]

  backend:
    image: customer-agent/backend:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    build:
      context: ./backend
      args:
        GRADLE_OPTS: ${CUSTOMER_AGENT_GRADLE_OPTS:-}
    environment:
      SPRING_PROFILES_ACTIVE: local-demo
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATABASE_URL: jdbc:postgresql://postgres:5432/customer_agent
      SPRING_DATABASE_USER: spring_app
      SPRING_DATABASE_PASSWORD: local-spring-app
      AGENT_SERVER_URL: http://agent-server:2024
      <<: *local-secrets
    depends_on:
      spring-migrate:
        condition: service_completed_successfully
      agent-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 4s
      retries: 30
    networks: [data, services, edge]

  compensation-executor:
    image: customer-agent/agent:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    entrypoint: ["python", "-m", "baseline_agent.compensation_executor"]
    environment:
      SPRING_INTERNAL_URL: http://backend:8080
      EXECUTOR_MACHINE_TOKEN: ${EXECUTOR_MACHINE_TOKEN:-local-executor-machine}
      EXECUTOR_POLL_DELAY: ${EXECUTOR_POLL_DELAY:-0.25}
      EXECUTOR_SIMULATION_SCENARIO: ${EXECUTOR_SIMULATION_SCENARIO:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [services]

  frontend:
    image: customer-agent/frontend:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4180:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/system/status"]
      interval: 3s
      timeout: 4s
      retries: 30
    networks: [edge]

  integration-smoke:
    image: customer-agent/agent:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    profiles: [smoke]
    entrypoint: ["python", "/smoke/smoke.py"]
    volumes:
      - ./agent/smoke.py:/smoke/smoke.py:ro
    environment:
      AGENT_SERVER_URL: http://agent-server:2024
      SPRING_INTERNAL_URL: http://backend:8080
      SPRING_DATABASE_URI: postgresql://spring_app:local-spring-app@postgres:5432/customer_agent
      SPRING_FIXTURE_DATABASE_URI: postgresql://spring_fixture:local-spring-fixture@postgres:5432/customer_agent
      AGENT_DATABASE_URI: postgresql://agent_runtime:local-agent-runtime@postgres:5432/agent_checkpoint
      SPRING_CROSS_DATABASE_URI: postgresql://spring_app:local-spring-app@postgres:5432/agent_checkpoint
      AGENT_CROSS_DATABASE_URI: postgresql://agent_runtime:local-agent-runtime@postgres:5432/customer_agent
      <<: *local-secrets
    depends_on:
      frontend:
        condition: service_healthy
    networks: [data, services]

  frontend-acceptance:
    image: customer-agent/frontend-test:${CUSTOMER_AGENT_IMAGE_TAG:-local}
    profiles: [smoke]
    entrypoint: ["npm", "test", "--", "src/App.integration.test.tsx"]
    environment:
      VITE_SMOKE_BASE_URL: http://frontend:8080
      VITE_E2E_SCENARIO: ${VITE_E2E_SCENARIO:-}
      VITE_E2E_ORDER_REFERENCE: ${VITE_E2E_ORDER_REFERENCE:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres-data:

networks:
  edge:
  services:
    internal: true
  data:
    internal: true
