[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-agent-recovery-prototype"
version = "0.0.0"
description = "Throwaway LangGraph recovery boundary prototype"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.0"
]

[tool.setuptools]
packages = ["prototype"]
