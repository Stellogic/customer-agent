name: deterministic-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run deterministic tests
        run: docker build --target test --tag customer-agent/${{ matrix.component }}-test:ci ${{ matrix.component }}

  fullstack-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run empty-database deterministic full-stack acceptance
        shell: pwsh
        run: ./scripts/smoke.ps1 -Reset
