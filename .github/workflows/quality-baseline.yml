name: quality-baseline-artifact

on:
  push:
    branches: [agent/add-quality-guardrails]

permissions:
  contents: read

jobs:
  format-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Java format and refresh dependency locks
        run: |
          docker run --rm \
            --volume "$PWD/backend:/workspace" \
            --workdir /workspace \
            gradle:9.3.1-jdk25 \
            gradle spotlessApply dependencies --write-locks --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-backend
          path: |
            backend/src
            backend/gradle.lockfile
          if-no-files-found: error
