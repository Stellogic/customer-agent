[project]
name = "customer-agent-baseline"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "httpx==0.28.1",
  "langgraph==1.2.10",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-cli[inmem]==0.4.30",
  "psycopg[binary,pool]==3.2.13",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/baseline_agent/rag_eval_v1/queries.json" = "baseline_agent/rag_eval_v1/queries.json"
"src/baseline_agent/rag_eval_v1/protocol.json" = "baseline_agent/rag_eval_v1/protocol.json"
"src/baseline_agent/rag_eval_v1/manifest.json" = "baseline_agent/rag_eval_v1/manifest.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM105"]

[tool.pyright]
include = ["src", "smoke.py", "approval_queue_time_smoke.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false
